version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: resto_dz_db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-resto_dz_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: ${DB_DATABASE:-resto_dz}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-resto_dz_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: resto_dz_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-resto_dz_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_DATABASE: ${DB_DATABASE:-resto_dz}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: resto_dz_frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data: