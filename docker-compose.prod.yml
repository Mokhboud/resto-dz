version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: resto_dz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-resto_dz_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-resto_dz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-resto_dz_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resto_dz_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resto_dz_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-resto_dz_user}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-resto_dz}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://restodz.dz,https://www.restodz.dz}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-no-reply@restodz.dz}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    networks:
      - resto_dz_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resto_dz_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - resto_dz_network

volumes:
  postgres_data:

networks:
  resto_dz_network:
    driver: bridge